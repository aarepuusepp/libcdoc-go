name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: ['1.27.3']

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Verify dependencies
      run: go mod verify

    - name: Run gofmt
      run: |
        mapfile -d '' sources < <(git ls-files -z -- '*.go')
        unformatted=$(gofmt -s -l "${sources[@]}")
        if [ -n "$unformatted" ]; then
          echo "The following files need formatting:"
          gofmt -d "${sources[@]}"
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v7.1.1
      with:
        files: ./coverage.out
        flags: unittests

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

  fuzz:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: Run fuzzing
      run: |
        go test -fuzz=FuzzValidateBaseURL -fuzztime=10s ./cdoc/cdoc2/riahttp/...

